services:
  backend:
    image: zimengxiong/excalidash-backend:0.6.0
    restart: unless-stopped
    environment:
      - DATABASE_PROVIDER=sqlite
      - DATABASE_URL=file:/app/prisma/dev.db
      - FRONTEND_URL=${FRONTEND_URL}
      - PORT=8000
      - NODE_ENV=production
      - AUTH_MODE=local
      - TRUST_PROXY=1
      - JWT_SECRET=${JWT_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
      - BACKUP_SCHEDULE=0 0 4 * * *
      - BACKUP_DIR=/app/backups
      - BACKUP_RETENTION_DAYS=14
    volumes:
      - /mnt/data/apps/excalidash/prisma:/app/prisma
      - /mnt/data/backups/excalidash:/app/backups
    networks:
      - excalidash-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://127.0.0.1:8000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))" ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: zimengxiong/excalidash-frontend:0.6.0
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - excalidash-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80" ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  excalidash-network:
    driver: bridge
